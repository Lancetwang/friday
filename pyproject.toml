[project]
name = "friday-agent"
version = "0.1.0"
description = "Friday, a general-purpose local CLI agent built on agent-core-runtime."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.54.0",
    "friday-agent-core==0.1.6",
    "rich>=13.7.0",
]

[project.scripts]
friday = "friday.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/friday"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
explicit = true

[tool.uv.sources]
friday-agent-core = { index = "pypi" }
