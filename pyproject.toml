[project]
name = "friday-agent"
version = "0.1.0"
description = "Friday, a general-purpose local CLI agent built on agent-core-runtime."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "friday-agent-core==0.1.0",
    "rich>=13.7.0",
]

[project.scripts]
friday = "friday.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/friday"]
