[project]
name = "friday-agent"
version = "0.1.0"
description = "Friday, a personal CLI agent built on agent-core-runtime."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agent-core-runtime @ https://github.com/Lancetwang/agent-core-runtime/archive/112a892ef38e3e47b482f1047a88402f73273d9b.zip",
    "rich>=13.7.0",
]

[project.scripts]
friday = "friday.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/friday"]

[tool.hatch.metadata]
allow-direct-references = true
