name: TypeScript migration

on:
  pull_request:
  push:
    branches: [codex/typescript-rewrite, main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_npm:
        description: Publish the npm packages from this ref
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: typescript-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - run: npm test
      - run: npm ci --prefix ui-desktop
      - run: npm run test:math --prefix ui-desktop
      - run: npm run test:sources --prefix ui-desktop
      - run: npm run build --prefix ui-desktop
      - run: npm run sidecar:ts
      - run: npm run smoke:sidecar:ts
      - name: Check Tauri TypeScript bridge
        env:
          TAURI_CONFIG: '{"bundle":{"externalBin":["binaries/friday-ts-app-server"]}}'
        run: cargo check --manifest-path ui-desktop/src-tauri/Cargo.toml --features typescript-sidecar

  npm-packages:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run pack:release
      - name: Smoke test npm packages
        run: |
          cli_prefix="$RUNNER_TEMP/friday-cli"
          core_dir="$RUNNER_TEMP/friday-core"
          npm install --global --prefix "$cli_prefix" artifacts/npm/friday-agent-*.tgz
          "$cli_prefix/bin/friday" --version
          mkdir -p "$core_dir"
          cd "$core_dir"
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/artifacts/npm/friday-agent-core-*.tgz
          node --input-type=module -e "const core = await import('friday-agent-core'); if (typeof core.Agent !== 'function') process.exit(1)"
      - name: Check Harbor adapter syntax
        run: python -m py_compile integrations/harbor/friday.py
      - uses: actions/upload-artifact@v6
        with:
          name: Friday-npm-packages
          path: artifacts/npm/*.tgz
          if-no-files-found: error

  desktop-installers:
    if: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.publish_npm != true) }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            artifact: Friday-Windows-x64
            bundle: nsis
            output: ui-desktop/src-tauri/target/release/bundle/nsis/*.exe
          - runner: macos-15
            artifact: Friday-macOS-arm64
            bundle: dmg
            output: ui-desktop/src-tauri/target/release/bundle/dmg/*.dmg
          - runner: ubuntu-24.04
            artifact: Friday-Linux-x64
            bundle: deb
            output: ui-desktop/src-tauri/target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui-desktop/package-lock.json
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - run: npm ci --prefix ui-desktop
      - run: npm run sidecar:ts
      - name: Build desktop installer
        run: npm run tauri --prefix ui-desktop -- build --features typescript-sidecar --config src-tauri/tauri.typescript.conf.json --bundles ${{ matrix.bundle }} --verbose
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.output }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [npm-packages, desktop-installers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: Friday-*
          path: release-assets
          merge-multiple: true
      - name: Verify release version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$(node -p "require('./package.json').version")" = "$version"
          test "$(node -p "require('./packages/core/package.json').version")" = "$version"
          test "$(node -p "require('./ui-desktop/package.json').version")" = "$version"
          test "$(node -p "require('./ui-desktop/src-tauri/tauri.conf.json').version")" = "$version"
      - name: Create checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f -print | sort)
          test "${#assets[@]}" -gt 0
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          elif [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --verify-tag --generate-notes --prerelease --title "Friday $GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --verify-tag --generate-notes --title "Friday $GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
          fi

  publish-npm:
    if: >-
      ${{
        always() &&
        vars.NPM_PUBLISH_ENABLED == 'true' &&
        needs.npm-packages.result == 'success' &&
        (
          (startsWith(github.ref, 'refs/tags/v') && needs.release.result == 'success') ||
          (github.event_name == 'workflow_dispatch' && inputs.publish_npm)
        )
      }}
    needs: [npm-packages, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: Friday-npm-packages
          path: npm-packages
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Configure npm token fallback
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          if [[ -n "$NPM_TOKEN" ]]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN" --location=user
          fi
      - name: Publish tested packages
        shell: bash
        run: |
          core="$(find ./npm-packages -maxdepth 1 -name 'friday-agent-core-*.tgz' -print -quit)"
          full="$(find ./npm-packages -maxdepth 1 -name 'friday-agent-*.tgz' ! -name 'friday-agent-core-*' -print -quit)"
          test -n "$core"
          test -n "$full"
          version="${core##*/}"
          version="${version#friday-agent-core-}"
          version="${version%.tgz}"
          channel=latest
          [[ "$version" == *-* ]] && channel=next
          if ! npm view "friday-agent-core@$version" version >/dev/null 2>&1; then
            npm publish "$core" --access public --tag "$channel" --provenance
          fi
          if ! npm view "friday-agent@$version" version >/dev/null 2>&1; then
            npm publish "$full" --access public --tag "$channel" --provenance
          fi
