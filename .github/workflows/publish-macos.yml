name: Publish macOS desktop

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui-desktop/package-lock.json
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.16"
      - run: npm ci --prefix ui-desktop
      - run: npm run sidecar --prefix ui-desktop
      - name: Smoke test sidecar
        shell: bash
        run: |
          binary="$GITHUB_WORKSPACE/ui-desktop/src-tauri/binaries/friday-app-server-$(rustc --print host-tuple)"
          test -f "$binary"
          chmod +x "$binary"
          cd "$(mktemp -d)"
          python3 "$GITHUB_WORKSPACE/ui-desktop/scripts/smoke-sidecar.py" "$binary"
      - run: npm run tauri --prefix ui-desktop -- build --bundles dmg
      # The DMG bundler deletes the intermediate .app, so everything that
      # inspects the shipped bundle must extract it from the DMG itself.
      - name: Verify DMG and bundled gateway
        shell: bash
        run: |
          source="$(find ui-desktop/src-tauri/target/release/bundle/dmg -name '*.dmg' -type f -print -quit)"
          mount="$(mktemp -d)"
          hdiutil attach "$source" -nobrowse -readonly -mountpoint "$mount" >/dev/null
          trap 'hdiutil detach "$mount" >/dev/null' EXIT
          codesign --verify --deep --strict --verbose=2 "$mount/Friday.app"
          work="$(mktemp -d)"
          cp -R "$mount/Friday.app" "$work/Friday.app"
          cd "$work"
          python3 "$GITHUB_WORKSPACE/ui-desktop/scripts/smoke-sidecar.py" "$work/Friday.app/Contents/MacOS/friday-app-server"
      - name: Probe quarantined sidecar launch
        shell: bash
        continue-on-error: true
        run: |
          source="$(find ui-desktop/src-tauri/target/release/bundle/dmg -name '*.dmg' -type f -print -quit)"
          mount="$(mktemp -d)"
          hdiutil attach "$source" -nobrowse -readonly -mountpoint "$mount" >/dev/null
          trap 'hdiutil detach "$mount" >/dev/null' EXIT
          for mode in root recursive; do
            probe="$(mktemp -d)/Friday.app"
            cp -R "$mount/Friday.app" "$probe"
            if [ "$mode" = root ]; then
              xattr -w com.apple.quarantine "0083;6890abcd;curl;" "$probe"
            else
              xattr -rw com.apple.quarantine "0083;6890abcd;curl;" "$probe"
            fi
            work="$(mktemp -d)" && cd "$work"
            if python3 "$GITHUB_WORKSPACE/ui-desktop/scripts/smoke-sidecar.py" "$probe/Contents/MacOS/friday-app-server"; then
              echo "QUARANTINE PROBE ($mode): sidecar launched normally"
            else
              echo "QUARANTINE PROBE ($mode): sidecar BLOCKED (reproduces user-reported failure)"
            fi
          done
      - name: Upload DMG
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          source="$(find ui-desktop/src-tauri/target/release/bundle/dmg -name '*.dmg' -type f -print -quit)"
          test -n "$source"
          version="$(node -p "require('./ui-desktop/package.json').version")"
          target="$(dirname "$source")/Friday_${version}_${RELEASE_ARCH}.dmg"
          mv "$source" "$target"
          gh release upload "$RELEASE_TAG" "$target" --clobber
